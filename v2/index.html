<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bat Doctor 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --pink: #ff7cc0; --pink-d: #d94a95; --navy: #1a1540; --cream: #fff6e8; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241a4d; color-scheme: dark;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: Fredoka, 'Baloo 2', system-ui, sans-serif; }
  canvas { display: block; }
  .ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(20,14,50,.25), rgba(12,8,32,.7)); transition: opacity .5s; z-index: 5; }
  .ov.hide { opacity: 0; pointer-events: none; }
  .card { text-align: center; }
  .title { font-size: clamp(44px, 11vw, 96px); font-weight: 700; line-height: 1; letter-spacing: .01em;
    color: #fff; background: linear-gradient(180deg, #fff 0%, #ffd2ea 45%, #ff8ccb 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 0 #b23c80) drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
  .sub { margin-top: 10px; font-size: clamp(16px, 3.4vw, 24px); font-weight: 600; color: #cfc6ff; letter-spacing: .12em; text-transform: uppercase; }
  .big { margin-top: 28px; width: 132px; height: 132px; border-radius: 50%; border: 0; cursor: pointer;
    background: radial-gradient(circle at 35% 28%, #ffd8ee 0 12%, #ff8cc8 40%, #e2549d 75%, #b93a7c 100%);
    box-shadow: 0 10px 0 #8e2b60, 0 18px 30px rgba(0,0,0,.45), inset 0 -8px 14px rgba(120,20,70,.35);
    display: inline-flex; align-items: center; justify-content: center; animation: bob 1.6s ease-in-out infinite; }
  .big:active { transform: translateY(6px); box-shadow: 0 4px 0 #8e2b60, 0 8px 16px rgba(0,0,0,.45); }
  .big svg { width: 58px; height: 58px; filter: drop-shadow(0 3px 0 rgba(120,20,70,.5)); }
  @keyframes bob { 50% { transform: translateY(-8px) scale(1.03); } }
  #home { position: fixed; left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); z-index: 6;
    width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); }
  #home svg { width: 26px; height: 26px; }
  #home .ring { position: absolute; inset: -4px; }
  #home .ring circle { fill: none; stroke: #ff9ad2; stroke-width: 4; stroke-dasharray: 176; stroke-dashoffset: 176; stroke-linecap: round; }
  #home.hold .ring circle { transition: stroke-dashoffset 1s linear; stroke-dashoffset: 0; }
</style>
</head>
<body>
<div id="start" class="ov"><div class="card">
  <div class="title">Bat Doctor</div>
  <div class="sub">3D preview</div>
  <button class="big" id="go" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="#fff"/></svg></button>
</div></div>
<div id="again" class="ov hide"><button class="big" id="againBtn" aria-label="Again"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" fill="#fff"/></svg></button></div>
<div id="home" aria-label="Hold to go home"><svg class="ring" viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" transform="rotate(-90 30 30)"/></svg>
  <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z" fill="#fff"/></svg></div>

<script type="module">
import * as THREE from './three.module.min.js';
import { RoomEnvironment } from './addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from './addons/geometries/RoundedBoxGeometry.js';

const TEST = location.hash.includes('test');
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const E = {
  io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  back: t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  lin: t => t,
};
const sleep = ms => new Promise(r => setTimeout(r, TEST ? Math.min(ms, 120) : ms));

// ───────────────────────── renderer, scene, camera ─────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const BG = 0x1c1744;
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 16, 48);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), .04).texture;

const camera = new THREE.PerspectiveCamera(35, 1, .1, 120);
const camTarget = V3(0, 1.3, .8);
const camBase = V3();
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  const need = Math.max(5.3, 7.4 / camera.aspect), d = need / (2 * Math.tan(THREE.MathUtils.degToRad(17.5)));
  camTarget.y = 1.3 + (need - 5.3) * .3; // tall screens: aim higher so the empty floor drops out of view
  camBase.set(0, camTarget.y + d * .2, camTarget.z + d);
  camera.position.copy(camBase); camera.lookAt(camTarget); camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ───────────────────────── textures drawn in code ─────────────────────────
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = canvasTex(128, 128, g => {
  const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.22, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
});
const sparkTex = canvasTex(128, 128, g => {
  const r = g.createRadialGradient(64, 64, 0, 64, 64, 40);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#fff'; g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? 9 : 60; g.lineTo(64 + Math.cos(a) * rr, 64 + Math.sin(a) * rr); }
  g.fill();
});
function heartPath(g, cx, cy, s) {
  g.beginPath(); g.moveTo(cx, cy + s * .5);
  g.bezierCurveTo(cx - s * .15, cy + s * .32, cx - s * .55, cy + s * .1, cx - s * .55, cy - s * .18);
  g.bezierCurveTo(cx - s * .55, cy - s * .45, cx - s * .2, cy - s * .55, cx, cy - s * .3);
  g.bezierCurveTo(cx + s * .2, cy - s * .55, cx + s * .55, cy - s * .45, cx + s * .55, cy - s * .18);
  g.bezierCurveTo(cx + s * .55, cy + s * .1, cx + s * .15, cy + s * .32, cx, cy + s * .5);
}
const heartTex = canvasTex(128, 128, g => {
  heartPath(g, 64, 66, 110); const gr = g.createLinearGradient(0, 10, 0, 120);
  gr.addColorStop(0, '#ff9ccc'); gr.addColorStop(1, '#ec3f86'); g.fillStyle = gr; g.fill();
  g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.ellipse(42, 44, 12, 8, -.6, 0, 7); g.fill();
});
const woodTex = canvasTex(1024, 256, (g, w, h) => {
  g.fillStyle = '#8f5631'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 160; i++) {
    const y = Math.random() * h, a = Math.random() * .16 + .03, amp = rand(2, 7), fr = rand(.004, .012), ph = rand(0, 6);
    g.strokeStyle = Math.random() < .5 ? `rgba(95,50,22,${a})` : `rgba(230,170,120,${a * .7})`;
    g.lineWidth = rand(.6, 2.4); g.beginPath();
    for (let x = 0; x <= w; x += 16) g.lineTo(x, y + Math.sin(x * fr + ph) * amp);
    g.stroke();
  }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping; woodTex.repeat.set(1.4, 1);
const skyTex = canvasTex(512, 512, (g, w) => {
  const r = g.createRadialGradient(256, 256, 20, 256, 256, 256);
  r.addColorStop(0, '#2d4590'); r.addColorStop(1, '#0d1440'); g.fillStyle = r; g.fillRect(0, 0, w, w);
  for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(255,250,230,${rand(.3, 1)})`; g.beginPath(); g.arc(rand(0, w), rand(0, w), rand(.6, 2.2), 0, 7); g.fill(); }
  const mg = g.createRadialGradient(300, 210, 40, 300, 210, 150);
  mg.addColorStop(0, 'rgba(255,240,190,.55)'); mg.addColorStop(1, 'rgba(255,240,190,0)'); g.fillStyle = mg; g.fillRect(0, 0, w, w);
  const mm = g.createRadialGradient(285, 195, 10, 300, 210, 72);
  mm.addColorStop(0, '#fffbe6'); mm.addColorStop(1, '#f6dfa0'); g.fillStyle = mm; g.beginPath(); g.arc(300, 210, 70, 0, 7); g.fill();
  g.fillStyle = 'rgba(214,186,120,.45)';
  [[275, 190, 14], [320, 235, 10], [318, 180, 7], [285, 240, 6]].forEach(([x, y, s]) => { g.beginPath(); g.arc(x, y, s, 0, 7); g.fill(); });
});

// ───────────────────────── materials ─────────────────────────
const M = {
  fur: c => new THREE.MeshPhysicalMaterial({ color: c, roughness: .62, sheen: 1, sheenRoughness: .32, sheenColor: new THREE.Color(0xffd6ea), envMapIntensity: .45 }),
  gloss: (c, r = .25) => new THREE.MeshPhysicalMaterial({ color: c, roughness: r, clearcoat: .7, clearcoatRoughness: .15, envMapIntensity: .7 }),
  matte: (c, r = .9) => new THREE.MeshStandardMaterial({ color: c, roughness: r, envMapIntensity: .3 }),
  metal: c => new THREE.MeshStandardMaterial({ color: c, metalness: 1, roughness: .16, envMapIntensity: 1.3 }),
  cloth: c => new THREE.MeshPhysicalMaterial({ color: c, roughness: .85, sheen: .8, sheenRoughness: .5, sheenColor: new THREE.Color(0xffffff), envMapIntensity: .3 }),
};
function mesh(geo, mat, cast = true, recv = false) { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = recv; return m; }

// ───────────────────────── lights ─────────────────────────
scene.add(new THREE.HemisphereLight(0xb9b0ff, 0x3a2620, .85));
const key = new THREE.DirectionalLight(0xffe2c6, 2.2);
key.position.set(-4, 8, 7); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -4, near: 1, far: 30 });
key.shadow.bias = -.0004; key.shadow.normalBias = .03;
scene.add(key);
const rimBlue = new THREE.DirectionalLight(0x9cc6ff, 3.2); rimBlue.position.set(5, 5, -6); scene.add(rimBlue);
const rimPink = new THREE.DirectionalLight(0xff86c8, 1.8); rimPink.position.set(-6, 2, -5); scene.add(rimPink);
const fill = new THREE.DirectionalLight(0xbcaeff, .7); fill.position.set(6, 2, 6); scene.add(fill);

// ───────────────────────── cave set ─────────────────────────
function hash(a, b, c) {
  let n = (Math.imul(a, 374761393) + Math.imul(b, 668265263) + Math.imul(c, 1274126177)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z), fx = x - ix, fy = y - iy, fz = z - iz;
  const s = t => t * t * (3 - 2 * t), u = s(fx), v = s(fy), w = s(fz), L = (a, b, t) => a + (b - a) * t;
  return L(L(L(hash(ix, iy, iz), hash(ix + 1, iy, iz), u), L(hash(ix, iy + 1, iz), hash(ix + 1, iy + 1, iz), u), v),
           L(L(hash(ix, iy, iz + 1), hash(ix + 1, iy, iz + 1), u), L(hash(ix, iy + 1, iz + 1), hash(ix + 1, iy + 1, iz + 1), u), v), w);
}
const fbm = (x, y, z) => vnoise(x, y, z) * .55 + vnoise(x * 2.1, y * 2.1, z * 2.1) * .3 + vnoise(x * 4.3, y * 4.3, z * 4.3) * .15;

{ // cave dome
  const geo = new THREE.SphereGeometry(20, 120, 80), pos = geo.attributes.position, col = [], v = V3();
  const dark = new THREE.Color(0x140f33), mid = new THREE.Color(0x352a74), lite = new THREE.Color(0x6a58c0);
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = fbm(v.x * .22 + 9, v.y * .22, v.z * .22);
    v.multiplyScalar(1 - n * .22); pos.setXYZ(i, v.x, v.y, v.z);
    const c = dark.clone().lerp(mid, clamp(n * 1.5 - .2, 0, 1)).lerp(lite, clamp(n * 2 - 1.2, 0, 1) * .6);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); geo.computeVertexNormals();
  const cave = mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, side: THREE.BackSide, envMapIntensity: .2 }), false, false);
  cave.position.set(0, 4, -3); scene.add(cave);
}
{ // floor
  const floor = mesh(new THREE.CircleGeometry(24, 64), M.matte(0x2e2360, 1), false, true);
  floor.rotation.x = -Math.PI / 2; floor.position.y = -1.3; scene.add(floor);
}
function spikeGeo(r, h, seed) {
  const pts = []; for (let i = 0; i <= 14; i++) { const t = i / 14; pts.push(new THREE.Vector2(r * Math.pow(1 - t, 1.25) * (1 + .1 * Math.sin(t * 9 + seed)) + .015, h * t)); }
  return new THREE.LatheGeometry(pts, 20);
}
{ // stalactites + stalagmites
  const mat = M.matte(0x3b2e78, .95), matB = M.matte(0x4a3b8c, .9);
  for (let i = 0; i < 22; i++) {
    const x = rand(-12, 12), z = rand(-9, -2.5), h = rand(2.2, 5), r = rand(.35, .9);
    const m = mesh(spikeGeo(r, h, i), i % 3 ? mat : matB, false, false);
    m.rotation.x = Math.PI; m.position.set(x, 10.5 + rand(-1, .5), z); scene.add(m);
  }
  for (let i = 0; i < 9; i++) {
    const sd = i % 2 ? 1 : -1, x = sd * rand(3.2, 8), z = rand(-5, -2), h = rand(1.6, 3.2), r = rand(.3, .6);
    const m = mesh(spikeGeo(r, h, i + 40), i % 3 ? matB : mat, false, false);
    m.rotation.x = Math.PI; m.position.set(x, rand(7.4, 8.2), z); scene.add(m);
  }
  for (let i = 0; i < 10; i++) {
    const x = (i % 2 ? 1 : -1) * rand(5.5, 12), z = rand(-9, -1.5), h = rand(1, 2.6), r = rand(.4, .8);
    const m = mesh(spikeGeo(r, h, i * 3), mat, false, true); m.position.set(x, -1.35, z); scene.add(m);
  }
}
function rock(x, y, z, r, sy = .7) {
  const geo = new THREE.SphereGeometry(r, 48, 32), pos = geo.attributes.position, v = V3();
  for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i); v.multiplyScalar(1 + (fbm(v.x * .8 + x, v.y * .8, v.z * .8) - .5) * .5); pos.setXYZ(i, v.x, v.y, v.z); }
  geo.computeVertexNormals();
  const m = mesh(geo, M.matte(0x3a2e78, .95), false, true); m.scale.y = sy; m.position.set(x, y, z); scene.add(m); return m;
}
rock(-6.4, -1.2, -2.2, 2.4, .62); rock(6.8, -1.3, -3, 2.6, .55); rock(-9.5, -1, -6.5, 2.8, .7);
const crystals = [];
function crystalCluster(x, z, color, n = 6, y = -1.3) {
  const g = new THREE.Group(); g.position.set(x, y, z);
  const mat = new THREE.MeshPhysicalMaterial({ color, emissive: color, emissiveIntensity: .55, roughness: .12, clearcoat: 1, transparent: true, opacity: .9, envMapIntensity: 1 });
  for (let i = 0; i < n; i++) {
    const s = rand(.35, .75), m = mesh(new THREE.OctahedronGeometry(.5, 0), mat, false, false);
    m.scale.set(s * .55, s * 2, s * .55); m.position.set(rand(-.6, .6), s * .6, rand(-.5, .5));
    m.rotation.set(rand(-.4, .4), rand(0, 3), rand(-.45, .45)); g.add(m);
  }
  const l = new THREE.PointLight(color, 9, 7, 2); l.position.set(0, 1.4, .6); g.add(l);
  scene.add(g); crystals.push({ g, mat, l, ph: rand(0, 6) });
}
crystalCluster(-5.9, -2, 0x47e2d4, 7, .15); crystalCluster(6.3, -2.8, 0xff79c6, 6, -.05); crystalCluster(-9.2, -6.2, 0x7aa8ff, 5, .6);

// cave mouth with the night sky and the moon (where healed bats fly home)
const MOUTH = V3(4.3, 2.9, -12);
{
  const g = new THREE.Group(); g.position.copy(MOUTH); g.lookAt(camBase.x, MOUTH.y - 1, camBase.z);
  const sky = new THREE.Mesh(new THREE.CircleGeometry(2.25, 64), new THREE.MeshBasicMaterial({ map: skyTex, fog: false }));
  g.add(sky);
  const rg = new THREE.TorusGeometry(2.35, .62, 20, 80), rp = rg.attributes.position, v = V3();
  for (let i = 0; i < rp.count; i++) { v.fromBufferAttribute(rp, i); const n = fbm(v.x * .9, v.y * .9, v.z * .9 + 4); v.multiplyScalar(1 + (n - .5) * .22); rp.setXYZ(i, v.x, v.y, v.z); }
  rg.computeVertexNormals();
  g.add(mesh(rg, M.matte(0x3e3080, .95), false, false));
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x8fa8ff, transparent: true, opacity: .35, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
  glow.scale.setScalar(9); glow.position.z = -.2; g.add(glow);
  const moonLight = new THREE.PointLight(0xa9bcff, 14, 16, 2); moonLight.position.set(0, 0, 1.5); g.add(moonLight);
  scene.add(g);
}

// hanging lantern
const lantern = new THREE.Group();
{
  lantern.position.set(-4.1, 5.0, -.6);
  const rope = mesh(new THREE.CylinderGeometry(.025, .025, 2.4, 6), M.matte(0x6b4a2a), false); rope.position.y = 1.2; lantern.add(rope);
  const cap = mesh(new THREE.ConeGeometry(.42, .35, 6), M.metal(0x9a6a3a)); cap.position.y = -.05; lantern.add(cap);
  const glass = mesh(new THREE.SphereGeometry(.34, 32, 20), new THREE.MeshStandardMaterial({ color: 0xffd28a, emissive: 0xffa94a, emissiveIntensity: 2.4, roughness: .3 }), false);
  glass.scale.y = 1.15; glass.position.y = -.45; lantern.add(glass);
  const base = mesh(new THREE.CylinderGeometry(.3, .24, .14, 6), M.metal(0x9a6a3a)); base.position.y = -.86; lantern.add(base);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffb35c, transparent: true, opacity: .55, depthWrite: false, blending: THREE.AdditiveBlending }));
  halo.scale.setScalar(3.2); halo.position.y = -.45; lantern.add(halo);
  const l = new THREE.PointLight(0xffa24f, 22, 11, 2); l.position.y = -.5; lantern.add(l);
  scene.add(lantern);
}

// exam table, cushion and a first-aid kit
{
  const table = mesh(new RoundedBoxGeometry(9.4, .7, 4.4, 5, .22), new THREE.MeshPhysicalMaterial({ map: woodTex, roughness: .5, clearcoat: .35, clearcoatRoughness: .3, envMapIntensity: .5 }), false, true);
  table.position.set(0, -.72, 1.2); scene.add(table);
  const cushion = mesh(new THREE.CylinderGeometry(1.5, 1.55, .26, 64), M.cloth(0x8fd6c3), true, true);
  cushion.position.set(0, -.23, .25); scene.add(cushion);
  const puff = mesh(new THREE.TorusGeometry(1.5, .14, 18, 72), M.cloth(0x7ccab6), true, true);
  puff.rotation.x = Math.PI / 2; puff.position.set(0, -.2, .25); scene.add(puff);
  const kit = new THREE.Group(); kit.position.set(3.45, .07, -.35); kit.rotation.y = -.45;
  kit.add(mesh(new RoundedBoxGeometry(1.25, .85, .75, 4, .13), M.gloss(0xfbf4e8, .35), true, true));
  const crossM = M.gloss(0xe0383f, .3);
  const c1 = mesh(new RoundedBoxGeometry(.46, .14, .06, 2, .03), crossM); c1.position.z = .38; kit.add(c1);
  const c2 = mesh(new RoundedBoxGeometry(.14, .46, .06, 2, .03), crossM); c2.position.z = .38; kit.add(c2);
  const handle = mesh(new THREE.TorusGeometry(.22, .045, 10, 24, Math.PI), M.metal(0xb8bcc6)); handle.position.y = .42; kit.add(handle);
  scene.add(kit);
}

// fireflies
const flies = (() => {
  const n = 46, geo = new THREE.BufferGeometry(), p = new Float32Array(n * 3), base = [];
  for (let i = 0; i < n; i++) { base.push([rand(-9, 9), rand(0, 7.5), rand(-8, 1.5), rand(0, 6)]); }
  geo.setAttribute('position', new THREE.BufferAttribute(p, 3));

function makeBat(cfg, scrapeKind) {

  const Z = V3(0, 0, 1);

  B.eyes = [-1, 1].map(sd => {
    const grp = new THREE.Group(), s = surf(sd * .33, .3, -.13);

  ws.quadraticCurveTo(.82, -.26, .36, -.46); ws.quadraticCurveTo(.24, -.1, 0, -.22);
  const wingGeo = new THREE.ExtrudeGeometry(ws, { depth: .035, bevelEnabled: true, bevelThickness: .03, bevelSize: .03, bevelSegments: 3, curveSegments: 28 });
  { const wp = wingGeo.attributes.position, wc = [], v = V3(), near = new THREE.Color(cfg.fur).lerp(new THREE.Color(0xffffff), .12), far = new THREE.Color(0xc23f86);
    for (let i = 0; i < wp.count; i++) { v.fromBufferAttribute(wp, i); const k = clamp(v.x / 2.3, 0, 1);
      wp.setZ(i, v.z - .32 * k * k + .06 * Math.sin(v.y * 2.4) * k); const c = near.clone().lerp(far, Math.pow(k, 1.4) * .75); wc.push(c.r, c.g, c.b); }
    wingGeo.setAttribute('color', new THREE.Float32BufferAttribute(wc, 3)); wingGeo.computeVertexNormals(); }
  const wingMat = new THREE.MeshPhysicalMaterial({ vertexColors: true, color: 0xffffff, roughness: .55, sheen: .7, sheenColor: new THREE.Color(0xffc4e2), sheenRoughness: .4, side: THREE.DoubleSide, envMapIntensity: .4 });
  const boneMat = M.gloss(0xc24a8a, .4);
  const bones = [[[.1, .3], [.62, .86], [1.22, 1.06]], [[1.22, 1.06], [1.8, .8], [2.32, .56]], [[1.22, 1.06], [1.6, .45], [1.97, -.16]], [[1.22, 1.06], [1.25, .2], [1.26, -.58]]];
  B.wings = [-1, 1].map(sd => {
    const piv = new THREE.Group(); piv.position.set(sd * .78, .04, -.22); if (sd < 0) piv.scale.x = -1;
    piv.add(mesh(wingGeo, wingMat));

    const claw = mesh(new THREE.ConeGeometry(.05, .14, 10), M.gloss(0xfff2f6, .3), false); claw.position.set(1.22, 1.14, wz(1.22, 1.1) - .02); claw.rotation.z = .5; piv.add(claw);
    add(piv); return piv;
  });

  // the scrape on the bat's left wing (screen right), in the same shape as the bandage it needs

  B.scrape = new THREE.Group(); B.scrape.position.set(1.0, .36, .085 - .32 * (1 / 2.3) ** 2 + .06 * Math.sin(.36 * 2.4) * (1 / 2.3) + .01);

  sIn.position.z = .004; B.scrape.add(sOut, sIn);
  for (let i = 0; i < 3; i++) { const l = new THREE.Mesh(new THREE.PlaneGeometry(.2, .025), new THREE.MeshBasicMaterial({ color: 0xffb3bf })); l.position.set(rand(-.08, .08), -.08 + i * .08, .008); l.rotation.z = .5; B.scrape.add(l); }

  const band = mesh(new THREE.TorusGeometry(.675, .055, 12, 64), M.gloss(cfg.hat[1], .38)); band.rotation.x = Math.PI / 2; hat.add(band);
  const visor = mesh(new THREE.CylinderGeometry(.52, .52, .05, 40, 1, false, -Math.PI / 2, Math.PI), M.gloss(cfg.hat[0], .38)); visor.scale.z = .75; visor.position.set(0, .02, .5); visor.rotation.x = .18; hat.add(visor);

}

function updateBat(B, t, dt) {
  const fs = B.flapSpeed, a = B.flapAmp;
  B.root.position.copy(B.base).add(B.offset);
  B.root.position.y += Math.sin(t * 2.3) * .085 * B.bobAmt;
  const flap = Math.sin(t * fs);
  B.wings[1].rotation.z = flap * a + .08; B.wings[0].rotation.z = -(flap * a + .08);
  B.wings[1].rotation.y = -Math.cos(t * fs) * a * .45 - .1; B.wings[0].rotation.y = -B.wings[1].rotation.y;
  const sq = Math.sin(t * fs + 1.2) * .022 * (a / .42) + B.squash;
  B.inner.scale.set(1 - sq * .6, 1 + sq, 1 - sq * .6);
  B.inner.rotation.z = Math.sin(t * 13) * B.wobble;
  B.ears.forEach((e, i) => { e.rotation.z = e.userData.rz + Math.sin(t * fs - 1.4) * .07 * (i ? 1 : -1) + Math.sin(t * 13 - .6) * B.wobble * 1.5; });
  B.prop.rotation.y += dt * B.propSpeed;
  // bank into horizontal movement
  B.vel.subVectors(B.root.position, B.last).divideScalar(Math.max(dt, 1e-3)); B.last.copy(B.root.position);
  B.bank += (clamp(-B.vel.x * .09, -.6, .6) - B.bank) * Math.min(1, dt * 5);
  B.root.rotation.z = B.bank; B.root.rotation.x = clamp(B.vel.y * -.03, -.3, .3);
  // blink
  B.blinkT -= dt;
  if (B.blinkT <= 0) { B.blinking = .16; B.blinkT = rand(2.2, 5); }
  if (B.blinking > 0) B.blinking -= dt;
  const lid = B.blinking > 0 ? Math.max(.08, Math.abs(B.blinking - .08) / .08) : (B.mood === 'open' ? .86 : 1);
  // eyes follow what the child is holding, otherwise the camera
  const tgt = B.lookTarget || camera.position;
  B.eyes.forEach(e => {
    e.grp.scale.y += (lid - e.grp.scale.y) * Math.min(1, dt * 30);
    const l = e.grp.worldToLocal(tgt.clone()).normalize();
    const ry = clamp(Math.atan2(l.x, l.z), -.42, .42), rx = clamp(-Math.atan2(l.y, l.z), -.36, .36);
    e.look.rotation.y += (ry - e.look.rotation.y) * Math.min(1, dt * 12); e.look.rotation.x += (rx - e.look.rotation.x) * Math.min(1, dt * 12);
  });
  // contact shadow
  const h = B.root.position.y;
  B.blob.position.x = B.root.position.x; B.blob.material.opacity = clamp(.55 - (h - 1.1) * .18, 0, .5); B.blob.scale.setScalar(.9 + (h - 1.4) * .25);
  // scrape throbs while it hurts
  if (B.scrape.visible) B.scrape.scale.setScalar(1 + Math.max(0, Math.sin(t * 5)) * .1 * (B.hurt ? 1 : .3));
}

  const tube = new THREE.CatmullRomCurve3([V3(0, .3, -.02), V3(.18, .75, -.1), V3(.05, 1.15, -.15), V3(0, 1.38, -.15)]);
  g.add(mesh(new THREE.TubeGeometry(tube, 40, .06, 12), M.gloss(0xd8433a, .32)));
  const neck = mesh(new THREE.CylinderGeometry(.055, .055, .22, 12), M.metal(0xd9dde6)); neck.position.y = .26; g.add(neck);
  [-1, 1].forEach(sd => {

}
function makeBandage(kind) {

const hitMat = new THREE.MeshBasicMaterial({ visible: false });
function makeTool(kind, obj, home) {

const TABLE_Y = .12, TOOL_Z = 2.35;

// ───────────────────────── particles ─────────────────────────
const parts = [];
function burst(pos, { n = 26, tex = sparkTex, color = 0xfff1a6, speed = 3.2, life = 1.1, size = .42, up = 1.2, grav = -2.4, additive = true } = {}) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.SpriteMaterial({ map: tex, color, transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending });
    const s = new THREE.Sprite(m); s.position.copy(pos); s.scale.setScalar(size); scene.add(s);
    const v = V3(rand(-1, 1), rand(-.4, 1), rand(-.6, .8)).normalize().multiplyScalar(speed * rand(.4, 1)); v.y += up;
    parts.push({ s, v, life: life * rand(.7, 1.2), t: 0, size: size * rand(.6, 1.2), grav, spin: rand(-3, 3) });
  }
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt; const e = p.t / p.life;
    p.s.position.addScaledVector(p.v, dt); p.v.y += p.grav * dt; p.v.multiplyScalar(Math.pow(.35, dt));
    p.s.material.opacity = e < .15 ? e / .15 : 1 - (e - .15) / .85; p.s.material.rotation += p.spin * dt;
    p.s.scale.setScalar(p.size * (1 - e * .4));
    if (e >= 1) { scene.remove(p.s); p.s.material.dispose(); parts.splice(i, 1); }
  }
}

// ───────────────────────── tweens ─────────────────────────
let clockT = 0;
const tweens = [];
function tween(dur, fn, ease = E.io) { return new Promise(res => tweens.push({ t0: clockT, dur: TEST ? Math.min(dur, .15) : dur, fn, ease, res })); }
function updateTweens() {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i], e = clamp((clockT - w.t0) / w.dur, 0, 1); w.fn(w.ease(e), e);
    if (e >= 1) { tweens.splice(i, 1); w.res(); }
  }
}
const bez = (a, b, c, t) => V3().addScaledVector(a, (1 - t) * (1 - t)).addScaledVector(b, 2 * (1 - t) * t).addScaledVector(c, t * t);

// ───────────────────────── sound ─────────────────────────
let AC = null, master, musicGain, voiceGain, lowpass;
function audioOn() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = 0; musicGain.connect(master);
  voiceGain = AC.createGain(); voiceGain.gain.value = 1.05; voiceGain.connect(master);
  lowpass = AC.createBiquadFilter(); lowpass.type = 'lowpass'; lowpass.frequency.value = 160; lowpass.connect(master);
  startMusic();
}
function tone({ f = 440, f2 = 0, type = 'sine', at = 0, d = .2, v = .2, a = .006, dest = master }) {
  if (!AC) return;
  const s = (at || AC.currentTime), o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, s); if (f2) o.frequency.exponentialRampToValueAtTime(f2, s + d);
  g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(v, s + a); g.gain.exponentialRampToValueAtTime(.0001, s + d);
  o.connect(g).connect(dest); o.start(s); o.stop(s + d + .05);
}
function noise({ at = 0, d = .4, v = .2, f1 = 400, f2 = 2400 }) {
  if (!AC) return;
  const s = at || AC.currentTime, len = Math.floor(AC.sampleRate * d), buf = AC.createBuffer(1, len, AC.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = buf; bp.type = 'bandpass'; bp.Q.value = 1.4; bp.frequency.setValueAtTime(f1, s); bp.frequency.exponentialRampToValueAtTime(f2, s + d);
  g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(v, s + d * .4); g.gain.linearRampToValueAtTime(0, s + d);
  src.connect(bp).connect(g).connect(master); src.start(s);
}
const now = () => AC ? AC.currentTime : 0;
const SFX = {
  squeak: () => { tone({ f: 1650, f2: 2500, d: .11, v: .07 }); tone({ f: 2500, f2: 1800, at: now() + .1, d: .1, v: .055 }); },
  pick: () => tone({ f: 520, f2: 880, d: .12, v: .12, type: 'triangle' }),
  pop: () => { tone({ f: 380, f2: 1100, d: .1, v: .16, type: 'triangle' }); },
  chime: () => [1318.5, 1568, 2093, 2637].forEach((f, i) => { tone({ f, at: now() + i * .075, d: .7, v: .06 }); tone({ f: f * 2, at: now() + i * .075, d: .25, v: .015 }); }),
  boing: () => tone({ f: 330, f2: 130, d: .38, v: .14, type: 'triangle' }),
  whoosh: () => noise({ d: .55, v: .16, f1: 300, f2: 2600 }),
  beat: () => { tone({ f: 78, f2: 44, d: .17, v: .9, dest: lowpass }); tone({ f: 70, f2: 42, at: now() + .2, d: .22, v: .7, dest: lowpass }); },
  giggle: () => [0, .08, .16, .24, .32].forEach((t, i) => tone({ f: 1400 + i * 140, f2: 2300 + i * 120, at: now() + t, d: .07, v: .055 })),
  sparkle: () => [2093, 2637, 3136, 2637, 3520].forEach((f, i) => tone({ f, at: now() + i * .05, d: .3, v: .035 })),
};
// soft marimba loop (C major pentatonic), quiet under the voice
let musicOn = false;
function startMusic() {
  if (musicOn || !AC) return; musicOn = true;
  musicGain.gain.setTargetAtTime(.55, AC.currentTime, 1.5);
  const notes = [523.25, 587.33, 659.25, 783.99, 880, 1046.5], bass = [130.81, 174.61, 196, 130.81];
  const mel = [0, 2, 4, 2, 3, 2, 1, -1, 0, 2, 4, 5, 4, 2, 1, -1], step = 60 / 92 / 2;
  let nextT = AC.currentTime + .1, i = 0;
  const mallet = (f, at, v) => { tone({ f, at, d: .55, v, dest: musicGain }); tone({ f: f * 3.98, at, d: .07, v: v * .22, dest: musicGain }); };
  setInterval(() => {
    while (nextT < AC.currentTime + .4) {
      const m = mel[i % 16]; if (m >= 0) mallet(notes[m], nextT, .045);
      if (i % 4 === 0) tone({ f: bass[(i / 4 | 0) % 4], at: nextT, d: .9, v: .06, dest: musicGain });
      nextT += step; i++;
    }
  }, 100);
}
function duck(on) { if (musicGain) musicGain.gain.setTargetAtTime(on ? .18 : .55, AC.currentTime, .15); }

// voice lines, shared with the 2D game
const LINE = {
  n_hoowy: 'Oh, look! Here comes Hoowy!', n_doowy: 'Oh, look! Here comes Doowy!', n_tooby: 'Oh, look! Here comes Tooby!',
  n_boopy: 'Oh, look! Here comes Boopy!', n_zoomy: 'Oh, look! Here comes Zoomy!',
  listen: "First... let's listen to the heart.", heartOk: 'Ba-dum, ba-dum! What a strong heart!',
  p_scrape: 'Oh no, a scrape! Can you find the bandage that matches?', wrong: "Hmm... not that one. Let's try another!",
  match: 'You did it! Great job!', tap: 'Now tap the bat, to help it feel better.', healed: 'Yay! All better!', home: 'Back home, with the family!',
};
const VB = /\/v2\/?/.test(location.pathname) ? '../voice/' : 'voice/';
let VMAP = null; const vbuf = {};
fetch(VB + 'voices.json').then(r => r.ok ? r.json() : null).then(j => VMAP = j).catch(() => {});
function loadVoice(k) {
  if (!AC || !VMAP || !VMAP[k]) return Promise.resolve(null);
  return vbuf[k] ||= fetch(VB + VMAP[k]).then(r => r.arrayBuffer()).then(b => AC.decodeAudioData(b)).catch(() => null);
}
let speaking = 0;
async function say(k) {
  if (TEST) { await sleep(60); return; }
  speaking++; duck(true);
  const buf = await loadVoice(k);
  await new Promise(res => {
    if (buf) { const s = AC.createBufferSource(); s.buffer = buf; s.connect(voiceGain); s.onended = res; s.start(); return; }
    if ('speechSynthesis' in window && LINE[k]) {
      const u = new SpeechSynthesisUtterance(LINE[k]); u.rate = .92; u.pitch = 1.15; u.onend = res; u.onerror = res;
      speechSynthesis.cancel(); speechSynthesis.speak(u); setTimeout(res, 7000); return;
    }
    setTimeout(res, 1500);
  });
  if (--speaking === 0) duck(false);
}

// ───────────────────────── game flow ─────────────────────────
let bat = null, tools = [], phase = 'menu', round = 0, taps = 0, hintTimer = null;
const G = { get phase() { return phase; }, get round() { return round; } };

function clearTools() { tools.forEach(t => scene.remove(t.holder)); tools = []; }
function popIn(T, delay = 0) {
  T.active = true; T.holder.scale.setScalar(.001);
  return sleep(delay).then(() => { SFX.pop(); return tween(.55, e => T.holder.scale.setScalar(Math.max(.001, e)), E.back); });
}
function popOut(T) { T.active = false; return tween(.35, e => T.holder.scale.setScalar(Math.max(.001, 1 - e)), E.io).then(() => { T.gone = true; scene.remove(T.holder); }); }
function sendHome(T) {
  const from = T.holder.position.clone(), rz = T.obj.rotation.z;
  return tween(.5, e => { T.holder.position.lerpVectors(from, T.home, e); T.obj.rotation.z = rz * (1 - e); T.obj.rotation.x = T.restTilt * e; T.holder.scale.setScalar(1.12 - .12 * e); }, E.back);
}
function armHint(fn) { clearTimeout(hintTimer); hintTimer = setTimeout(fn, 9000); }

async function playRound() {
  const cfg = BATS[round % BATS.length], kind = ['heart', 'star', 'circle'][round % 3];
  if (bat) { scene.remove(bat.root); scene.remove(bat.blob); }
  clearTools(); taps = 0;
  bat = makeBat(cfg, kind); bat.hurt = false;
  phase = 'intro';
  // fly in from the left, swooping past the lantern
  const p0 = V3(-10, 5, -4), p1 = V3(-3.5, 5.2, 1.5), p2 = V3(0, 1.62, .25);
  bat.flapSpeed = 13; bat.propSpeed = 22; bat.offset.set(0, 0, 0); bat.base.copy(p0); bat.last.copy(p0);
  SFX.whoosh(); setTimeout(SFX.squeak, 500);
  await tween(2.1, e => bat.base.copy(bez(p0, p1, p2, e)), E.out);
  bat.flapSpeed = 7; bat.propSpeed = 3;
  await squashHop(); bat.setMood('open'); SFX.squeak();
  await say('n_' + cfg.name); bat.setMood('happy');
  // stethoscope
  const st = makeTool('steth', makeSteth(), V3(0, TABLE_Y + .05, TOOL_Z)); tools.push(st);
  await popIn(st);
  phase = 'listen'; await say('listen');
  armHint(() => hint());
}
async function squashHop() {
  await tween(.14, e => bat.squash = -.12 * e);
  await tween(.4, e => bat.squash = -.12 * (1 - e) + Math.sin(e * Math.PI) * .1, E.out);
  bat.squash = 0;
}
function hint() {
  if (!['listen', 'bandage'].includes(phase) || drag) return armHint(hint);
  const right = tools.find(t => t.active && (phase === 'listen' ? t.kind === 'steth' : t.kind === bat.scrapeKind));
  if (right) { right.wiggle = 1.6; burst(right.holder.position.clone().add(V3(0, .4, 0)), { n: 10, size: .3, speed: 1.6, up: .8, grav: -1 }); }
  say(phase === 'listen' ? 'listen' : 'p_scrape'); armHint(hint);
}

async function onStethOnChest(T) {
  phase = 'busy'; clearTimeout(hintTimer); T.active = false; drag = null;
  const target = () => bat.worldOf(bat.chest).add(V3(0, 0, .22));
  const from = T.holder.position.clone();
  const rz0 = T.obj.rotation.z, s0 = T.holder.scale.x;
  await tween(.45, e => { T.holder.position.lerpVectors(from, target(), e); T.obj.rotation.x = 0; T.obj.rotation.z = rz0 + (Math.PI - .25 - rz0) * e; T.holder.scale.setScalar(s0 + (.8 - s0) * e); }, E.out);
  bat.setMood('happy'); bat.bobAmt = .3; bat.flapAmp = .25;
  // four heartbeats: the heart glows and the bat swells a little with each one
  for (let i = 0; i < 4; i++) {
    SFX.beat();
    burst(bat.worldOf(bat.chest).add(V3(-.35, .25, .3)), { n: 1, tex: heartTex, color: 0xffffff, size: .55, speed: .3, up: 1.6, grav: 0, life: 1.4, additive: false });
    await tween(.2, e => { const k = Math.sin(e * Math.PI); bat.heart.material.opacity = .9 * k; bat.heartGlow.material.opacity = .85 * k; bat.heart.scale.setScalar(1 + .25 * k); bat.squash = .03 * k; T.holder.position.copy(target()); });
    await tween(.22, e => { const k = Math.sin(e * Math.PI) * .7; bat.heart.material.opacity = .9 * k; bat.heartGlow.material.opacity = .85 * k; bat.heart.scale.setScalar(1 + .2 * k); T.holder.position.copy(target()); });
    await sleep(380);
  }
  bat.squash = 0; bat.setMood('open'); SFX.giggle();
  await say('heartOk'); bat.setMood('happy');
  await popOut(T); bat.bobAmt = 1; bat.flapAmp = .42;
  // now the scrape
  bat.hurt = true; bat.setMood('worried'); bat.wobble = .06; bat.flapAmp = .16; bat.flapSpeed = 5;
  setTimeout(() => bat && (bat.wobble = 0), 600);
  SFX.boing();
  const kinds = ['heart', 'star', 'circle'].sort(() => Math.random() - .5);
  kinds.forEach((k, i) => { const T2 = makeTool(k, makeBandage(k), V3((i - 1) * 2.05, TABLE_Y + .08, TOOL_Z)); T2.obj.scale.setScalar(.82); tools.push(T2); });
  await Promise.all(tools.filter(t => !t.gone).map((t, i) => popIn(t, i * 160)));
  phase = 'bandage';
  await say('p_scrape');
  armHint(hint);
}
async function onWrongBandage(T) {
  T.active = false; drag = null; SFX.boing(); bat.wobble = .08; setTimeout(() => bat && (bat.wobble = 0), 500);
  const from = T.obj.rotation.z;
  await Promise.all([sendHome(T), tween(.5, e => T.obj.rotation.y = Math.sin(e * Math.PI * 4) * .5 * (1 - e))]);
  T.obj.rotation.z = from * 0; T.active = true;
  if (!speaking) say('wrong');
}
async function onRightBandage(T) {
  phase = 'busy'; clearTimeout(hintTimer); T.active = false; drag = null;
  const wing = bat.wings[1];
  wing.attach(T.holder);
  const p0 = T.holder.position.clone(), q0 = T.holder.quaternion.clone(), s0 = T.holder.scale.x, oz = T.obj.rotation.clone();
  const pEnd = bat.scrape.position.clone().add(V3(0, 0, .07)), qEnd = new THREE.Quaternion();
  await tween(.4, e => { T.holder.position.lerpVectors(p0, pEnd, e); T.holder.quaternion.slerpQuaternions(q0, qEnd, e); T.holder.scale.setScalar(s0 + (.64 - s0) * e); T.obj.rotation.set(oz.x * (1 - e), oz.y * (1 - e), oz.z * (1 - e)); }, E.out);
  bat.scrape.visible = false; bat.hurt = false;
  SFX.chime(); burst(bat.scrapeWorld(), { n: 30 });
  bat.setMood('open'); bat.flapAmp = .42; bat.flapSpeed = 7;
  await Promise.all(tools.filter(t => t !== T && !t.gone).map(popOut));
  await squashHop();
  await say('match');
  bat.setMood('happy'); phase = 'tap';
  await say('tap');
}
async function onBatTap() {
  if (phase === 'tap') {
    taps++; SFX.giggle(); bat.setMood('open'); bat.wobble = .07;
    burst(bat.root.position.clone().add(V3(0, 1, .6)), { n: 6, tex: heartTex, color: 0xffffff, size: .5, speed: 1.5, up: 2.2, grav: -.3, life: 1.6, additive: false });
    setTimeout(() => bat && (bat.wobble = 0), 400);
    squashHop();
    if (taps >= 3) { phase = 'busy'; await sleep(500); await flyHome(); }
    return;
  }
  if (phase === 'listen' || phase === 'bandage' || phase === 'end') { SFX.squeak(); bat.wobble = .05; setTimeout(() => bat && (bat.wobble = 0), 300); }
}
async function flyHome() {
  bat.setMood('open'); await say('healed');
  bat.flapSpeed = 14; bat.propSpeed = 30; SFX.whoosh(); setTimeout(SFX.squeak, 300);
  const start = bat.base.clone();
  // a happy loop-the-loop, then out through the cave mouth to the moon
  await tween(1.1, e => { const a = e * Math.PI * 2; bat.base.set(start.x + Math.sin(a) * 1.2, start.y + (1 - Math.cos(a)) * 1.1, start.z); bat.inner.rotation.x = -a; }, E.io);
  bat.inner.rotation.x = 0;
  const p0 = bat.base.clone(), p1 = V3(3.5, 5, -2), p2 = MOUTH.clone().add(V3(0, 0, -.5));
  await tween(2.2, e => { bat.base.copy(bez(p0, p1, p2, e)); bat.root.scale.setScalar(1 - e * .45); }, E.io);
  SFX.sparkle(); burst(MOUTH.clone().add(V3(0, 0, .6)), { n: 34, size: .6, speed: 3, color: 0xfff6c8 });
  bat.root.visible = false; bat.blob.visible = false;
  phase = 'end';
  await say('home');
  round++;
  $('#again').classList.remove('hide');
}

// ───────────────────────── input ─────────────────────────
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane();
let drag = null;
function setNDC(e) { ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); }
renderer.domElement.addEventListener('pointerdown', e => {
  audioOn(); setNDC(e);
  const live = tools.filter(t => t.active);
  const hit = live.length && ray.intersectObjects(live.map(t => t.hit), false)[0];
  if (hit && (phase === 'listen' || phase === 'bandage')) {
    const T = hit.object.userData.tool;
    plane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(V3()).negate(), T.holder.position);
    const p = V3(); ray.ray.intersectPlane(plane, p);
    drag = { T, goal: p.add(V3(0, .35, 0)), id: e.pointerId };
    renderer.domElement.setPointerCapture(e.pointerId);
    SFX.pick(); clearTimeout(hintTimer);
    return;
  }
  if (bat && bat.root.visible && ray.intersectObjects(bat.meshes, false).length) onBatTap();
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  setNDC(e); const p = V3(); if (ray.ray.intersectPlane(plane, p)) drag.goal.copy(p.add(V3(0, .35, 0)));
});
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  const T = drag.T; drag = null; armHint(hint);
  if (T.active) sendHome(T);
};
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

const sp = (w) => { const v = w.clone().project(camera); return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight }; };
function checkSnap() {
  if (!drag) return;
  const T = drag.T, a = sp(T.holder.position), r = Math.min(innerWidth, innerHeight) * .13;
  if (phase === 'listen' && T.kind === 'steth') {
    const b = sp(bat.worldOf(bat.chest)); if (Math.hypot(a.x - b.x, a.y - b.y) < r) onStethOnChest(T);
  } else if (phase === 'bandage') {
    const b = sp(bat.scrapeWorld()); if (Math.hypot(a.x - b.x, a.y - b.y) < r) (T.kind === bat.scrapeKind ? onRightBandage : onWrongBandage)(T);
  }
}

// hold the house button for a second to go back to the 2D game
{
  const h = $('#home'); let t = null;
  if (!/\/v2\/?/.test(location.pathname)) h.style.display = 'none';
  const down = () => { h.classList.add('hold'); t = setTimeout(() => location.href = '../index.html', 1000); };
  const up = () => { h.classList.remove('hold'); clearTimeout(t); };
  h.addEventListener('pointerdown', down); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => h.addEventListener(ev, up));
}
$('#go').addEventListener('click', () => { audioOn(); $('#start').classList.add('hide'); playRound(); });
$('#againBtn').addEventListener('click', () => { audioOn(); $('#again').classList.add('hide'); playRound(); });

// ───────────────────────── main loop ─────────────────────────
// a bat idles on the cushion behind the title screen
bat = makeBat(BATS[0], 'heart'); bat.scrape.visible = false;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05); clockT += dt; const t = clockT;
  updateTweens();
  if (drag) {
    const T = drag.T, prev = T.holder.position.clone();
    T.holder.position.lerp(drag.goal, 1 - Math.exp(-dt * 22));
    const vx = (T.holder.position.x - prev.x) / Math.max(dt, 1e-3);
    T.obj.rotation.z += (clamp(-vx * .06, -.5, .5) - T.obj.rotation.z) * Math.min(1, dt * 10);
    T.obj.rotation.x += (0 - T.obj.rotation.x) * Math.min(1, dt * 10);
    T.holder.scale.setScalar(T.holder.scale.x + (1.12 - T.holder.scale.x) * Math.min(1, dt * 12));
    checkSnap();
  }
  tools.forEach(T => { if (!T.active) T.wiggle = 0; if (T.wiggle > 0) { T.wiggle -= dt; T.obj.rotation.z = Math.sin(t * 22) * .22 * Math.min(1, T.wiggle); if (T.wiggle <= 0) T.obj.rotation.z = 0; } });
  if (bat) { bat.lookTarget = drag ? drag.T.holder.position : null; updateBat(bat, t, dt); }
  lantern.rotation.z = Math.sin(t * .9) * .05; lantern.rotation.x = Math.sin(t * .7) * .03;
  crystals.forEach(c => { c.mat.emissiveIntensity = .45 + Math.sin(t * 1.3 + c.ph) * .2; c.l.intensity = 8 + Math.sin(t * 1.3 + c.ph) * 2.5; });
  flies(t); updateParts(dt);
  camera.position.set(camBase.x + Math.sin(t * .23) * .12, camBase.y + Math.sin(t * .31) * .06, camBase.z); camera.lookAt(camTarget);
  renderer.render(scene, camera);
});

if (TEST) window.__v2 = {
  G, get bat() { return bat; }, get tools() { return tools; }, get drag() { return drag; },
  screenOf: w => sp(w), toolScreen: kind => { const T = tools.find(t => t.kind === kind && t.active); return T && sp(T.holder.position.clone()); },
  chestScreen: () => sp(bat.worldOf(bat.chest)), scrapeScreen: () => sp(bat.scrapeWorld()), batScreen: () => sp(bat.root.position.clone().add(V3(0, .1, 0))),
};
</script>
