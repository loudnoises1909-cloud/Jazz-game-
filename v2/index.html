<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bat Cave 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --pink: #ff7cc0; --pink-d: #d94a95; --navy: #1a1540; --cream: #fff6e8; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241a4d; color-scheme: dark;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: Fredoka, 'Baloo 2', system-ui, sans-serif; }
  canvas { display: block; }
  #vig { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,.5) 100%); }
  .ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(20,14,50,.25), rgba(12,8,32,.7)); transition: opacity .5s; z-index: 5; }
  .ov.hide { opacity: 0; pointer-events: none; }
  .card { text-align: center; }
  .title { font-size: clamp(44px, 11vw, 96px); font-weight: 700; line-height: 1; letter-spacing: .01em;
    color: #fff; background: linear-gradient(180deg, #fff 0%, #ffe6b0 45%, #ffad45 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 0 #8a3b12) drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
  .sub { margin-top: 10px; font-size: clamp(16px, 3.4vw, 24px); font-weight: 600; color: #cfc6ff; letter-spacing: .12em; text-transform: uppercase; }
  .big { margin-top: 28px; width: 132px; height: 132px; border-radius: 50%; border: 0; cursor: pointer;
    background: radial-gradient(circle at 35% 28%, #ffe0c4 0 12%, #ff9a5c 40%, #e2582e 75%, #b23e1c 100%);
    box-shadow: 0 10px 0 #7e2a14, 0 18px 30px rgba(0,0,0,.45), inset 0 -8px 14px rgba(120,40,10,.35);
    display: inline-flex; align-items: center; justify-content: center; animation: bob 1.6s ease-in-out infinite; }
  .big:active { transform: translateY(6px); box-shadow: 0 4px 0 #7e2a14, 0 8px 16px rgba(0,0,0,.45); }
  .big svg { width: 58px; height: 58px; filter: drop-shadow(0 3px 0 rgba(120,40,10,.5)); }
  @keyframes bob { 50% { transform: translateY(-8px) scale(1.03); } }
  #home { position: fixed; left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); z-index: 6;
    width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); }
  #home svg { width: 26px; height: 26px; }
  #home .ring { position: absolute; inset: -4px; }
  #home .ring circle { fill: none; stroke: #ffb347; stroke-width: 4; stroke-dasharray: 176; stroke-dashoffset: 176; stroke-linecap: round; }
  #home.hold .ring circle { transition: stroke-dashoffset 1s linear; stroke-dashoffset: 0; }
  #menu { flex-direction: column; justify-content: space-between; padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom)); box-sizing: border-box;
    background: linear-gradient(180deg, rgba(8,8,20,.55), rgba(8,8,20,0) 30%, rgba(8,8,20,0) 62%, rgba(8,8,20,.6)); }
  #menu .title { font-size: clamp(40px, 9vw, 84px); }
  #cards { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(10px, 2.2vw, 22px); max-width: 980px; }
  .card { width: clamp(118px, 17vw, 168px); padding: 12px 8px 12px; border-radius: 26px; border: 0; cursor: pointer; text-align: center;
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06)); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.14), 0 12px 26px rgba(0,0,0,.4); color: #fff; font-family: inherit; transition: transform .15s; }
  .card:active { transform: scale(.95); }
  .card .ic { width: 74%; aspect-ratio: 1; margin: 0 auto 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 28%, #ffe0c4 0 10%, #ff9a5c 45%, #d4532c 100%); box-shadow: 0 6px 0 #7e2a14, inset 0 -6px 10px rgba(120,40,10,.35); }
  .card:nth-child(2) .ic { background: radial-gradient(circle at 35% 28%, #d6fff6 0 10%, #3fc9b4 45%, #17786e 100%); box-shadow: 0 6px 0 #0e4b45, inset 0 -6px 10px rgba(0,60,50,.35); }
  .card:nth-child(3) .ic { background: radial-gradient(circle at 35% 28%, #fff2c4 0 10%, #f0b93a 45%, #b07a12 100%); box-shadow: 0 6px 0 #6e4a08, inset 0 -6px 10px rgba(110,70,0,.35); }
  .card:nth-child(4) .ic { background: radial-gradient(circle at 35% 28%, #d8e6ff 0 10%, #5d8cff 45%, #2c4fb0 100%); box-shadow: 0 6px 0 #1b2f6e, inset 0 -6px 10px rgba(20,30,90,.35); }
  .card:nth-child(5) .ic { background: radial-gradient(circle at 35% 28%, #ffd8d0 0 10%, #e0533e 45%, #a3291c 100%); box-shadow: 0 6px 0 #5e160e, inset 0 -6px 10px rgba(90,20,10,.35); }
  .card svg { width: 62%; height: 62%; }
  .card b { display: block; font-size: clamp(15px, 2.2vw, 20px); font-weight: 700; letter-spacing: .02em; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
  #classic { position: fixed; right: 14px; bottom: 10px; z-index: 6; color: rgba(255,255,255,.55); font-size: 13px; text-decoration: none; }
  #prog { position: fixed; top: max(22px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 4; display: none; gap: 10px; }
  #prog i { width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); transition: background .3s, transform .3s; }
  #prog i.on { background: radial-gradient(circle at 35% 30%, #fff2c4, #f0b93a 60%, #b07a12); box-shadow: 0 0 12px rgba(240,185,58,.7); transform: scale(1.15); }
</style>
</head>
<body>
<div id="vig"></div>
<div id="menu" class="ov">
  <div class="title">Bat Cave</div>
  <div id="cards"><button class="card" data-g="doctor"><div class="ic"><svg viewBox="0 0 64 64"><path d="M18 8v14a14 14 0 0 0 28 0V8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M32 36v8a10 10 0 0 0 20 0v-4" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="52" cy="36" r="7" fill="#fff"/><circle cx="52" cy="36" r="3" fill="#d4532c"/></svg></div><b>Bat Doctor</b></button><button class="card" data-g="maze"><div class="ic"><svg viewBox="0 0 64 64"><ellipse cx="32" cy="40" rx="24" ry="16" fill="#fff"/><circle cx="20" cy="22" r="10" fill="#fff"/><circle cx="44" cy="22" r="10" fill="#fff"/><circle cx="21" cy="22" r="4.5" fill="#17786e"/><circle cx="43" cy="22" r="4.5" fill="#17786e"/><path d="M18 44q14 10 28 0" fill="none" stroke="#17786e" stroke-width="4" stroke-linecap="round"/></svg></div><b>Froggy Tag</b></button><button class="card" data-g="busy"><div class="ic"><svg viewBox="0 0 64 64"><path d="M32 6l5 7 8-3 1 9 9 1-3 8 7 5-7 5 3 8-9 1-1 9-8-3-5 7-5-7-8 3-1-9-9-1 3-8-7-5 7-5-3-8 9-1 1-9 8 3z" fill="#fff"/><circle cx="32" cy="32" r="9" fill="#b07a12"/></svg></div><b>Busy Board</b></button><button class="card" data-g="bath"><div class="ic"><svg viewBox="0 0 64 64"><path d="M8 34q0 20 26 20t24-18q-6-6-16-2 2-10-4-16-8-6-16 0-6 6-2 14-8-4-12 2z" fill="#fff"/><path d="M12 26l-8 2 8 4z" fill="#ffd27a"/><circle cx="22" cy="22" r="3" fill="#2c4fb0"/></svg></div><b>Bat Bath</b></button><button class="card" data-g="band"><div class="ic"><svg viewBox="0 0 64 64"><ellipse cx="32" cy="24" rx="22" ry="8" fill="#fff"/><path d="M10 24v20q22 14 44 0V24" fill="#fff" opacity=".85"/><path d="M14 30l10 16 8-16 8 16 10-16" fill="none" stroke="#a3291c" stroke-width="3"/><path d="M40 6l14 14M48 4l8 8" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg></div><b>Bat Band</b></button></div>
</div>
<div id="prog"></div>
<div id="again" class="ov hide"><button class="big" id="againBtn" aria-label="Again"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" fill="#fff"/></svg></button></div>
<div id="home" aria-label="Hold to go home" style="display:none"><svg class="ring" viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" transform="rotate(-90 30 30)"/></svg>
  <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z" fill="#fff"/></svg></div>
<a id="classic" href="../index.html" style="display:none">Classic 2D game</a>
<script type="module" src="./main.js"></script>
</body>
</html>
