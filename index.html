<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bat Doctor">
<meta name="theme-color" content="#1b2a3d">
<title>Bat Doctor</title>
<link id="touchIcon" rel="apple-touch-icon" href="">
<link id="favIcon" rel="icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root{
    /* vintage cartoon palette: ink + paper + muted primaries. The bat stays pink. */
    --ink:#231a14; --cream:#f3e9d2; --paper:#efe2c4;
    --navy:#22364f; --navy2:#2f4a6d; --mustard:#e0a930; --brick:#b5432f; --olive:#6b7a3a;
    --wood:#7a4e2d; --wood2:#5a3a22;
    --slot:clamp(64px, 13vmin, 130px);
    --tool:clamp(84px, min(18vh, 20vw), 160px);
    --display:"Luckiest Guy","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
  body{
    background:radial-gradient(ellipse at 50% 40%, #3b5a7e 0%, var(--navy) 55%, #131d2b 100%);
    background-color:var(--navy);
    color:var(--cream);
    font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  }

  /* ---------- old-film look: paper grain + vignette ---------- */
  #grain{position:fixed;inset:0;pointer-events:none;z-index:450;opacity:.22;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .32  0 0 0 1.4 -.2'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:449;background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(10,6,4,.55) 100%)}

  /* ---------- cave background ---------- */
  #bg{position:fixed;inset:0;pointer-events:none;z-index:0}
  #bg svg.rocks{position:absolute;left:0;top:0;width:100%;height:22%}
  .twinkle{position:absolute;width:7px;height:7px;background:var(--cream);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 3s ease-in-out infinite}
  .moon{position:absolute;left:5%;top:17%;width:clamp(44px,9vmin,84px);height:clamp(44px,9vmin,84px);border-radius:50%;
        box-shadow:inset -15px 6px 0 0 var(--cream);transform:rotate(-20deg);opacity:.9}
  #rings{position:fixed;left:50%;top:50%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;border-radius:50%;z-index:0;pointer-events:none;
         background:repeating-radial-gradient(circle, var(--brick) 0 5vmax, var(--mustard) 5vmax 10vmax, var(--cream) 10vmax 15vmax, var(--navy2) 15vmax 20vmax);
         transform:scale(0);opacity:.85;transition:transform 1.4s cubic-bezier(.2,.8,.3,1)}
  body.party #rings{transform:scale(1)}

  /* ---------- layout ---------- */
  #app{position:fixed;inset:0;z-index:1;display:grid;grid-template-rows:auto 1fr auto;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}

  /* the "wall of healed bats": empty dashed spots become little wooden picture frames */
  #shelf{display:flex;justify-content:center;gap:clamp(8px,1.8vmin,18px);padding:clamp(10px,2.2vmin,20px) 72px clamp(14px,2.4vmin,24px);transition:transform .7s}
  .slot{position:relative;width:var(--slot);height:calc(var(--slot) * .65);border-radius:8px;border:3px dashed rgba(243,233,210,.35);
        background:rgba(243,233,210,.04);display:grid;place-items:center;overflow:visible}
  .slot.filled{border:5px solid var(--wood);background:var(--paper);
        box-shadow:0 0 0 3px var(--ink), inset 0 0 0 2px var(--ink), 0 6px 0 3px var(--ink)}
  .slot svg.pcsvg{width:100%;height:100%;display:block}
  .slot.filled{border-width:3px}
  .slot.filled svg{animation:popIn .5s ease-out}
  .slot.dance{animation:dance .55s ease-in-out infinite alternate}
  body.party #shelf{transform:translateY(24vh) scale(1.4)}

  #stage{position:relative;display:grid;place-items:center;min-height:0}
  #batWrap{width:min(92vw, 74vh, 800px);will-change:transform}
  #batFloat{animation:bob 3s ease-in-out infinite}
  .batsvg{width:100%;height:auto;display:block;overflow:visible}
  .wing{transform-box:fill-box;transform-origin:100% 45%;animation:flap 1.8s ease-in-out infinite}
  .flying .wing{animation-duration:.22s}
  .prop{transform-box:fill-box;transform-origin:center;animation:prop .45s linear infinite}
  .flying .prop{animation-duration:.12s}
  .booboo-pulse{transform-box:fill-box;transform-origin:center;animation:throb 1.3s ease-in-out infinite}
  .stick{transform-box:fill-box;transform-origin:center;animation:stick .4s ease-out}
  .melt{transform-box:fill-box;transform-origin:center;animation:melt .6s ease-in forwards}

  #bat.sad{animation:shiver .45s ease-in-out 2}
  #bat.hmm{animation:hmm .8s ease-in-out}
  #bat.bounce{animation:bounce .35s ease-out}
  #bat.flip{animation:flip .9s ease-in-out}
  #bat.hint{animation:hintPulse 1s ease-in-out 2}

  #meter{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);display:flex;gap:14px;opacity:0;transition:opacity .3s;pointer-events:none}
  #meter.show{opacity:1}
  #meter svg{width:clamp(40px,7.5vmin,68px);height:auto;overflow:visible}
  #meter polygon{fill:rgba(243,233,210,.12);stroke:var(--cream);stroke-width:5;stroke-linejoin:round;transition:fill .2s}
  #meter .on polygon{fill:var(--mustard);stroke:var(--ink)}
  #meter .on{animation:popIn .4s ease-out}

  /* bandages sit on a wooden doctor's shelf */
  #tray{position:relative;display:flex;justify-content:center;align-items:center;gap:clamp(14px,4vw,52px);
        padding:clamp(10px,2vh,18px) 16px calc(clamp(12px,2.6vh,28px) + env(safe-area-inset-bottom));
        min-height:calc(var(--tool) + 36px);
        background:
          repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 22px, rgba(0,0,0,.12) 22px 24px),
          linear-gradient(180deg, #8a5a32, var(--wood2));
        border-top:5px solid var(--ink);box-shadow:inset 0 6px 0 rgba(255,255,255,.12)}
  .tool{width:var(--tool);height:var(--tool);touch-action:none;position:relative;z-index:5;
        filter:drop-shadow(4px 5px 0 rgba(35,26,20,.55));will-change:transform}
  .tool svg{width:100%;height:100%;overflow:visible;display:block}
  .tool svg.pop{animation:popIn .45s ease-out both}
  .tool svg.wiggle{animation:wiggle 1.1s ease-in-out 2}
  .tool.dragging{z-index:100}
  .tool.gone{opacity:0;transition:opacity .4s;pointer-events:none}

  /* ---------- overlays ---------- */
  .overlay{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:16px}
  #start{background:var(--navy);overflow:hidden}
  #start::before{content:"";position:absolute;left:50%;top:44%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;border-radius:50%;
        background:repeating-radial-gradient(circle, var(--navy2) 0 6vmax, var(--navy) 6vmax 12vmax);animation:ringPulse 6s ease-in-out infinite}
  #start > *{position:relative}
  #start h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(44px,10vmin,110px);line-height:1;color:var(--mustard);
            -webkit-text-stroke:3px var(--ink);text-shadow:5px 6px 0 var(--brick), 8px 10px 0 var(--ink);letter-spacing:2px;transform:rotate(-3deg)}
  #startBat .batsvg{width:min(72vw,46vh,520px);animation:bob 3s ease-in-out infinite}
  .bigBtn{width:clamp(110px,19vmin,170px);height:clamp(110px,19vmin,170px);border-radius:50%;border:6px solid var(--ink);
          background:var(--brick);box-shadow:0 9px 0 var(--ink);display:grid;place-items:center;
          animation:breathe 1.6s ease-in-out infinite;touch-action:manipulation;cursor:pointer;padding:0}
  .bigBtn:active{transform:translateY(6px);box-shadow:0 3px 0 var(--ink)}
  .bigBtn svg{width:52%;height:52%}
  #start small{opacity:.7;font-size:clamp(12px,1.8vmin,16px);text-align:center;max-width:520px;color:var(--cream)}
  #again{position:fixed;left:50%;top:60%;transform:translate(-50%,-50%) scale(0);z-index:250;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
  #again.show{transform:translate(-50%,-50%) scale(1)}

  #gear{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:calc(env(safe-area-inset-right) + 10px);z-index:400;
        width:48px;height:48px;border-radius:50%;border:0;background:rgba(243,233,210,.1);display:grid;place-items:center;
        opacity:.5;touch-action:none;overflow:hidden;padding:0}
  #gear svg{width:26px;height:26px;position:relative;z-index:1}
  #gear::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--brick);transform:scale(0)}
  #gear.holding::after{animation:holdfill 1.5s linear forwards}

  #panel{background:rgba(12,10,8,.82);display:none;z-index:500}
  #panel.show{display:flex}
  #panel .card{background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);border-radius:14px;
               width:min(640px,100%);max-height:90vh;overflow:auto;padding:20px 20px 16px;touch-action:pan-y;-webkit-user-select:text;user-select:text}
  #panel h2{margin:0 0 4px;font-family:var(--display);font-weight:400;letter-spacing:1px}
  #panel p{margin:4px 0 12px;font-size:14px;opacity:.85}
  .row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:2px dashed rgba(35,26,20,.25)}
  .row .txt{flex:1;min-width:0}
  .row small{display:block;font-size:12px;opacity:.7}
  .row button,.panelBtns button{border:3px solid var(--ink);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:800;background:var(--cream);color:var(--ink);min-width:44px;min-height:44px;font-family:inherit}
  .row button.rec{background:var(--brick);color:var(--cream)}
  .row button.rec.on{background:var(--ink);animation:breathe 1s infinite}
  .row button:disabled{opacity:.35}
  .opts{display:flex;flex-wrap:wrap;gap:16px;margin:12px 0;font-size:15px}
  .opts label{display:flex;align-items:center;gap:6px}
  .opts input{width:22px;height:22px;accent-color:var(--brick)}
  .opts select{font:inherit;padding:6px 8px;border:3px solid var(--ink);border-radius:8px;background:var(--cream);color:var(--ink)}
  .panelBtns{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
  .panelBtns button.primary{background:var(--navy2);color:var(--cream)}
  .note{background:#f5d98a;border:2px solid var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:8px;display:none}

  /* ---------- effects ---------- */
  .spark{position:fixed;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;pointer-events:none;z-index:200;animation:burst .9s ease-out forwards}
  .conf{position:fixed;top:-70px;pointer-events:none;z-index:150;animation:fall var(--d) linear forwards}


  /* routine checklist: listen, temperature, fix, stars */
  #steps{position:absolute;top:1%;left:50%;transform:translateX(-50%);display:flex;gap:clamp(8px,1.6vmin,14px);z-index:3;pointer-events:none}
  .st{position:relative;width:clamp(40px,7vmin,62px);height:clamp(40px,7vmin,62px);border-radius:12px;background:var(--paper);
      border:3px solid var(--ink);opacity:.4;transition:opacity .3s, transform .3s, box-shadow .3s}
  .st svg{width:100%;height:100%;display:block}
  .st.cur{opacity:1;transform:scale(1.18);box-shadow:0 0 0 4px var(--mustard)}
  .st.done{opacity:1}
  .st.done::after{content:"";position:absolute;right:-9px;bottom:-9px;width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);
      background:var(--olive) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 12.5l4.5 4.5L19 7.5' fill='none' stroke='%23f3e9d2' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/80% no-repeat}
  .slot .nm{position:absolute;left:-10px;right:-10px;bottom:-1.5em;text-align:center;font-family:var(--display);font-size:clamp(11px,1.8vmin,16px);color:var(--cream);letter-spacing:1px;text-shadow:2px 2px 0 var(--ink)}
  #bat.weak .wing{animation-duration:4.5s}
  #bat.inbox .wing{animation:none;transform:scale(.55) rotate(18deg);transition:transform .5s}
  .drop-in{transform-box:fill-box;transform-origin:center bottom;animation:dropIn .45s cubic-bezier(.3,1.5,.5,1)}
  .pop-in{animation:none}
  .pop-in > *{transform-box:fill-box;transform-origin:center;animation:popIn .4s ease-out}
  .lift-out{animation:liftOut .5s ease-in forwards}
  .pluck{animation:pluck .8s ease-in forwards}
  .beat{transform-box:fill-box;transform-origin:center;animation:beat .65s ease-in-out infinite}
  .tw{transform-box:fill-box;transform-origin:center;animation:twinkle 1s ease-in-out infinite}
  @keyframes dropIn{0%{transform:translateY(-40px);opacity:0}100%{transform:none;opacity:1}}
  @keyframes liftOut{to{transform:translateY(40px);opacity:0}}
  @keyframes pluck{to{transform:translate(40px,-55px) rotate(20deg);opacity:0}}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
  /* moonlight flight home + family postcard */
  #night{position:fixed;inset:0;z-index:260;opacity:0;pointer-events:none;transition:opacity .6s;overflow:hidden;
         background:radial-gradient(circle at 72% 26%, #46668c 0, #22364f 38%, #101826 100%)}
  #night.show{opacity:1;pointer-events:auto}
  .moonbig{position:absolute;left:72%;top:26%;width:min(28vmin,240px);height:min(28vmin,240px);transform:translate(-50%,-50%);border-radius:50%;
           background:radial-gradient(circle at 35% 40%, rgba(0,0,0,.08) 0 10%, transparent 11%), radial-gradient(circle at 62% 64%, rgba(0,0,0,.07) 0 13%, transparent 14%), radial-gradient(circle at 66% 30%, rgba(0,0,0,.06) 0 7%, transparent 8%), var(--cream);
           border:4px solid var(--ink);box-shadow:0 0 70px 24px rgba(243,233,210,.28)}
  #night .trees{position:absolute;left:0;bottom:0;width:100%;height:30%}
  .flyer{position:absolute;left:0;top:0;width:min(40vw,360px);animation:flyHome 3s ease-in forwards}
  @keyframes flyHome{0%{transform:translate(8vw,52vh) scale(1)}30%{transform:translate(28vw,40vh) scale(.78) rotate(-6deg)}
    60%{transform:translate(48vw,30vh) scale(.5) rotate(5deg)}100%{transform:translate(58vw,12vh) scale(.12) rotate(0);opacity:.2}}
  #postcard{position:fixed;left:50%;top:50%;width:min(88vw,110vh,780px);z-index:270;pointer-events:none;
            transform:translate(-50%,-50%) scale(0) rotate(-14deg);filter:drop-shadow(8px 10px 0 rgba(0,0,0,.45))}
  #postcard.show{transition:transform .6s cubic-bezier(.3,1.5,.5,1);transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
  #postcard svg{width:100%;height:auto;display:block}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes flap{0%,100%{transform:scaleY(1) rotate(0)}50%{transform:scaleY(.78) rotate(-9deg)}}
  @keyframes prop{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.06)}}
  @keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  @keyframes stick{0%{transform:scale(1.6);opacity:0}70%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
  @keyframes melt{0%{transform:scale(1);opacity:1}40%{transform:scale(1.25)}100%{transform:scale(0) rotate(90deg);opacity:0}}
  @keyframes shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @keyframes hmm{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}65%{transform:rotate(5deg)}}
  @keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.07,.94)}100%{transform:scale(1)}}
  @keyframes flip{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-50px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
  @keyframes hintPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes popIn{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-12deg) scale(1.1)}40%{transform:rotate(10deg) scale(1.1)}60%{transform:rotate(-8deg) scale(1.08)}80%{transform:rotate(5deg)}}
  @keyframes dance{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
  @keyframes breathe{0%,100%{scale:1}50%{scale:1.07}}
  @keyframes holdfill{from{transform:scale(0)}to{transform:scale(1)}}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.85}}
  @keyframes ringPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  @keyframes burst{
    0%{transform:translate(var(--x0),var(--y0)) scale(.3) rotate(0);opacity:1}
    100%{transform:translate(calc(var(--x0) + var(--dx)),calc(var(--y0) + var(--dy))) scale(1.1) rotate(200deg);opacity:0}}
  @keyframes fall{to{transform:translateY(120vh) rotate(var(--r))}}
  @media (prefers-reduced-motion: reduce){ #batFloat,.wing,.prop,.booboo-pulse,#start::before{animation:none} }
</style>
</head>
<body>

<div id="bg">
  <svg class="rocks" viewBox="0 0 1000 120" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#121a26" stroke="#231a14" stroke-width="3" d="M0,0 H1000 V18 L975,60 L955,20 L930,44 L905,16 L880,80 L858,22 L830,40 L806,14 L780,70 L752,18 L728,36 L700,12 L676,95 L650,20 L622,42 L600,14 L575,66 L548,18 L520,38 L496,12 L470,84 L445,20 L420,44 L398,14 L372,70 L346,18 L320,36 L296,12 L270,90 L245,22 L220,40 L196,14 L170,72 L146,20 L120,42 L96,14 L72,84 L48,22 L24,44 L0,16 Z"/>
  </svg>
  <div class="moon"></div>
</div>
<div id="rings"></div>
<div id="night"></div>
<div id="postcard"></div>

<div id="app">
  <div id="shelf"></div>
  <div id="stage">
    <div id="steps"></div>
    <div id="meter"></div>
    <div id="batWrap"><div id="batFloat"></div></div>
  </div>
  <div id="tray"></div>
</div>

<button id="again" class="bigBtn" aria-label="Play again">
  <svg viewBox="0 0 100 100"><path d="M74,30 A30,30 0 1,0 80,56" fill="none" stroke="#f3e9d2" stroke-width="12" stroke-linecap="round"/><path d="M60,22 L84,26 L78,48 Z" fill="#f3e9d2" stroke="#f3e9d2" stroke-width="6" stroke-linejoin="round"/></svg>
</button>

<div id="start" class="overlay">
  <h1>Bat Doctor</h1>
  <div id="startBat"></div>
  <button id="play" class="bigBtn" aria-label="Play">
    <svg viewBox="0 0 100 100"><path d="M36,22 L80,50 L36,78 Z" fill="#f3e9d2" stroke="#f3e9d2" stroke-width="10" stroke-linejoin="round"/></svg>
  </button>
  <small>Grown-ups: press and hold ⚙︎ (top right) for 2 seconds for settings.</small>
</div>

<button id="gear" aria-label="Grown-up settings (press and hold)">
  <svg viewBox="0 0 24 24" fill="none" stroke="#f3e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<div id="panel" class="overlay">
  <div class="card">
    <h2>Grown-up corner</h2>
    <p>Settings for grown-ups.</p>
    <div class="opts">
      <label><input type="checkbox" id="optTts"> Device voice for any line without a recording</label>
      <label><input type="checkbox" id="optSfx"> Sound effects</label>
      <label>Postcards: <select id="optTheme"></select></label>
    </div>
    <div class="panelBtns"><button class="primary" id="closePanel">Done</button></div>
  </div>
</div>

<div id="vignette"></div>

  beach: 'Beach', camping: 'Camping', picnic: 'Picnic', snow: 'Snow day', birthday: 'Birthday',
  museum: 'Dinosaur museum', stars: 'Stargazing', rain: 'Rainy day'
};
function thanksgivingDay(y) { const d = new Date(y, 10, 1); return new Date(y, 10, 1 + ((4 - d.getDay() + 7) % 7) + 21); }
function easterDay(y) { // anonymous Gregorian algorithm
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}
function holidayFor(now) {
  const y = now.getFullYear(), D = (m, d) => new Date(y, m, d);
  const day = new Date(y, now.getMonth(), now.getDate());
  const within = (a, b) => day >= a && day <= b;
  if (within(D(9, 10), D(9, 31))) return 'halloween';
  if (within(D(10, 1), thanksgivingDay(y))) return 'thanksgiving';
  if (within(D(11, 1), D(11, 26))) return 'christmas';
  if (within(D(11, 27), D(11, 31)) || within(D(0, 1), D(0, 1))) return 'newyear';
  const e = easterDay(y); if (within(new Date(y, e.getMonth(), e.getDate() - 14), e)) return 'easter';
  if (within(D(5, 25), D(6, 4))) return 'july4';
  return null;
}

    const near = Math.hypot(x - tc.x, y - tc.y) < Math.max(130, info.home.width * .9);
    const onBat = x > br.left && x < br.right && y > br.top && y < br.bottom;
    if (!near && !onBat) { returnHome(el); S.busy = false; return; }
  }
  if (st.accept(t)) {
    S.phase = 'acting'; S.step = null; clearIdle();
    const s = Math.max(.3, Math.min(1, tr.width * 1.3 / info.home.width));
    el.style.transition = 'transform .25s ease-out';
    el.style.transform = `translate(${tc.x - hc.x}px,${tc.y - hc.y}px) scale(${s})`;
    await wait(260);
    el.style.visibility = 'hidden';
    [...tray.children].forEach(x => x !== el && x.classList.add('gone'));
    S.busy = false;
    await st.onAccept(tc);
  } else {
    S.wrong++;
    sfx.soft(); returnHome(el); batAnim('hmm'); say('wrong');
    if (S.wrong >= 2) setTimeout(hintTool, 500);
    armIdle();
    await wait(350);
    S.busy = false;
  }
}

/* ================= the doctor's routine: listen → temperature → fix → stars ================= */
function stepListen() {
  setStep(0);
  offer([{ kind: 'stetho' }], {
    prompt: 'listen', target: () => svgRect(200, 210, 28), accept: t => t.kind === 'stetho',
    onAccept: async () => {
      const weak = S.cur.problem === 'hungry';
      layer('tools').innerHTML = `<g class="drop-in">
        <path d="M212,214 Q262,252 318,206" stroke="${INK}" stroke-width="11" fill="none" stroke-linecap="round"/>
        <path d="M212,214 Q262,252 318,206" stroke="#b5432f" stroke-width="5" fill="none" stroke-linecap="round"/>
        <circle cx="200" cy="212" r="15" fill="#dfe2e6" ${sw}/><circle cx="200" cy="212" r="7" fill="#c9ccd1" stroke="${INK}" stroke-width="2"/></g>`;
      const c = weak ? '#c9a3ae' : '#d23b3b', sc = weak ? .7 : 1;
      layer('fx').innerHTML = `<g transform="translate(322,74)"><circle r="40" fill="${CREAM}" ${sw}/>
        <g class="beat" style="animation-duration:${weak ? 1.1 : .65}s"><path transform="scale(${sc * .55}) translate(-50,-48)" d="M50,85 C10,55 0,35 10,20 C20,5 42,8 50,25 C58,8 80,5 90,20 C100,35 90,55 50,85Z" fill="${c}" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/></g></g>`;
      for (let i = 0; i < (weak ? 3 : 4); i++) { sfx.thump(weak); await wait(weak ? 1100 : 650); }
      await say(weak ? 'heartWeak' : 'heartOk');
      layer('tools').innerHTML = ''; layer('fx').innerHTML = '';
      stepTemp();
    }
  });
}
function stepTemp() {
  setStep(1);
  offer([{ kind: 'thermo' }], {
    prompt: 'temp', target: () => svgRect(186, 194, 26), accept: t => t.kind === 'thermo',
    onAccept: async () => {
      const cold = S.cur.problem === 'hungry';
      layer('tools').innerHTML = `<g transform="translate(184,198) rotate(-52) scale(.85)">${THERMO}</g>`;
      const merc = $('#bat .merc');
      merc.style.transform = 'scaleY(.08)';
      await wait(60);
      merc.style.transition = 'transform 1.3s ease-out';
      merc.style.transform = `scaleY(${cold ? .22 : .6})`;
      sfx.rise();
      await wait(1400);
      layer('fx').innerHTML = cold
        ? `<g transform="translate(74,74)" class="pop-in"><circle r="38" fill="#9fcbd6" ${sw}/>
             <path d="M0,-24 V24 M-21,-12 L21,12 M-21,12 L21,-12" stroke="${CREAM}" stroke-width="7" stroke-linecap="round"/>
             <path d="M0,-24 V24 M-21,-12 L21,12 M-21,12 L21,-12" stroke="#2f4a6d" stroke-width="3" stroke-linecap="round"/></g>`
        : `<g transform="translate(74,74)" class="pop-in"><circle r="38" fill="#5f8f3a" ${sw}/>
             <path d="M-16,0 L-4,13 L18,-12" stroke="${CREAM}" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
      sfx.pop();
      await say(cold ? 'tempCold' : 'tempOk');
      await wait(300);
      layer('tools').innerHTML = ''; layer('fx').innerHTML = '';
      stepFix();
    }
  });
}
function stepFix() {
  setStep(2);
  const p = S.cur.problem, level = S.healed;
  if (p === 'scrape') {
    offer(S.round.tools, {
      prompt: 'p_scrape', target: () => layer('booboo').firstElementChild.getBoundingClientRect(), accept: t => t === S.round.target,
      onAccept: async c => {
        const { x, y } = S.spot, t = S.round.target;
        layer('booboo').style.opacity = 0;
        layer('bandage').innerHTML = `<g transform="translate(${x},${y})"><g class="stick">${bandageSVG(t.shape, t.color.c, 27)}</g></g>`;
        sfx.match(); sparkle(c.x, c.y, 10); vibrate(20); setHappy(.4); batAnim('bounce');
        await say('match'); stepHeal();
      }
    });
  } else if (p === 'bump') {
    offer(pickTools('icebag', level), {
      prompt: 'p_bump', target: () => svgRect(BUMP_SPOT.x, BUMP_SPOT.y, 22), accept: t => t.kind === 'icebag',
      onAccept: async c => {
        layer('tools').innerHTML = `<g transform="translate(${BUMP_SPOT.x + 4},${BUMP_SPOT.y - 12}) rotate(24) scale(.5)"><g class="stick">${TOOL_ICON.icebag}</g></g>`;
        sfx.match(); vibrate(20);
        await wait(500);
        layer('booboo').querySelector('.bump').classList.add('melt');
        await wait(900);
        layer('tools').innerHTML = ''; layer('booboo').innerHTML = '';
        sparkle(c.x, c.y, 10); setHappy(.4); batAnim('bounce');
        await say('match'); stepHeal();
      }
    });
  } else if (p === 'splinter') {
    const { x, y } = S.spot;
    offer(pickTools('tweezers', level), {
      prompt: 'p_splinter', target: () => svgRect(x + 8, y - 8, 22), accept: t => t.kind === 'tweezers',
      onAccept: async c => {
        layer('tools').innerHTML = `<g transform="translate(${x + 18},${y - 20})"><g class="pull"><g transform="rotate(40) scale(.5) translate(0,-44)">${TWEEZ}</g></g></g>`;
        await wait(500);
        layer('tools').querySelector('.pull').classList.add('pluck');
        layer('booboo').querySelector('.splinter').classList.add('pluck');
        sfx.pop(); vibrate(20);
        await wait(800);
        layer('booboo').querySelector('.sore').classList.add('melt');
        layer('tools').innerHTML = '';
        sparkle(c.x, c.y, 10); sfx.match(); setHappy(.4); batAnim('bounce');
        await wait(400);
        layer('booboo').innerHTML = '';
        await say('match'); stepHeal();
      }
    });
  } else {
    say('p_hungry').then(() => { if (S.phase !== 'party') hungryBox(); });
    S.phase = 'acting';
  }
}
function hungryBox() {
  offer([{ kind: 'box' }], {
    prompt: 'box', target: () => svgRect(200, 205, 55), accept: t => t.kind === 'box',
    onAccept: async () => {
      layer('behind').innerHTML = `<path class="drop-in" d="M124,216 L276,216 L284,240 L116,240 Z" fill="#8a5f2e" ${sw}/>`;
      layer('care').innerHTML = `<g class="box-front drop-in">
        <path d="M112,238 L288,238 L281,286 L119,286 Z" fill="#c08a4a" ${sw}/>
        <path d="M114,250 L286,250 L285,260 L115,260 Z" fill="#b5432f"/>
        <rect x="184" y="265" width="32" height="14" rx="2" fill="${CREAM}" stroke="${INK}" stroke-width="2.5"/></g>`;
      $('#bat').classList.add('inbox');
      sfx.pop(); vibrate(15);
      await wait(800);
      hungryBlanket();
    }
  });
}
function hungryBlanket() {
  offer([{ kind: 'blanket' }], {
    prompt: 'blanket', target: () => svgRect(200, 220, 45), accept: t => t.kind === 'blanket',
    onAccept: async c => {
      const v = [150, 170, 190, 210, 230, 250].map(x => `M${x},${x > 160 && x < 240 ? 207 : 210} V252`).join(' ');
      layer('care').insertAdjacentHTML('afterbegin', `<g class="drop-in">
        <path d="M132,212 Q200,200 268,212 L272,254 L128,254 Z" fill="#b5432f" ${sw}/>
        <path d="${v}" stroke="${CREAM}" stroke-width="4" opacity=".85"/>
        <path d="M130,224 H270 M129,236 H271" stroke="#2f4a6d" stroke-width="4"/>
        <path d="M132,212 Q200,200 268,212" fill="none" ${sw}/></g>`);
      sfx.match(); sparkle(c.x, c.y, 6);
      await wait(800);
      hungryBottle();
    }
  });
}
function hungryBottle() {
  offer([{ kind: 'bottle' }], {
    prompt: 'bottle', target: () => svgRect(206, 192, 26), accept: t => t.kind === 'bottle',
    onAccept: async () => {
      layer('tools').innerHTML = `<g transform="translate(208,194) rotate(-135) scale(.8)">${BOTTLE}</g>`;
      const milk = $('#bat .milk');
      await wait(60);
      milk.style.transition = 'transform 2.8s linear';
      milk.style.transform = 'scaleY(.08)';
      $('#bat').classList.add('drinking');
      setWeak(false, 2600); $('#bat .lids').style.display = 'inline';
      for (let i = 0; i < 6; i++) { sfx.glug(); await wait(470); if (i === 3) $('#bat .lids').style.display = 'none'; }
      $('#bat').classList.remove('drinking');
      layer('tools').innerHTML = '';
      setHappy(.4); batAnim('bounce');
      stepHeal();
    }
  });
}
function stepHeal() {
  setStep(3);
  S.phase = 'healing'; S.taps = 0;
  $('#meter').classList.add('show');
  say('tap'); armIdle();
}

/* ================= healing taps ================= */
stage.addEventListener('pointerdown', e => {
  if (S.phase !== 'healing' || S.paused || S.taps >= 3) return;
  armIdle();
  S.taps++;
  $$('#meter svg')[S.taps - 1].classList.add('on');
  sparkle(e.clientX, e.clientY, 7); sfx.chime(S.taps); vibrate(12);
  setHappy(.4 + .2 * S.taps); batAnim('bounce');
  if (S.taps === 3) healDone();
});
async function healDone() {
  S.phase = 'done'; clearIdle(); setStep(4);
  await wait(250);
  const bc = center(wrap.getBoundingClientRect());
  sparkle(bc.x, bc.y, 16);
  const band = layer('bandage').querySelector('.stick'); if (band) band.classList.add('melt');
  if (S.cur.problem === 'hungry') {
    layer('care').querySelectorAll(':scope > g').forEach(g => g.classList.add('lift-out'));
    layer('behind').innerHTML = '';
  }
  sfx.yay();
  await wait(650);
  ['bandage', 'booboo', 'care', 'tools', 'fx'].forEach(n => { layer(n).innerHTML = ''; });
  $('#bat').classList.remove('inbox');
  setHappy(1);
  batAnim('flip');
  await say('healed');
  await wait(200);
  $('#meter').classList.remove('show');
  await flyHome();
  S.healed++;
  if (S.healed >= TOTAL) party();
  else { await wait(600); nextBat(); }
}
function nightTrees() {
  let o = '', x = -20, i = 0;
  while (x < 1020) {
    const h = 70 + ((i * 37) % 60), pine = i % 3 !== 1;
    o += pine
      ? `<polygon points="${x},200 ${x + h * .35},${200 - h} ${x + h * .7},200" fill="#0d141e" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`
      : `<rect x="${x + 22}" y="${200 - h * .5}" width="10" height="${h * .5}" fill="#0d141e"/><circle cx="${x + 27}" cy="${200 - h * .7}" r="${h * .36}" fill="#101a26" stroke="${INK}" stroke-width="3"/>`;
    x += pine ? h * .5 : h * .62; i++;
  }
  return `<svg class="trees" viewBox="0 0 1000 200" preserveAspectRatio="none">${o}<rect x="0" y="186" width="1000" height="14" fill="#0d141e"/></svg>`;
}
// wait for a tap on the night scene (after minMs), or move on by itself after a few seconds
const tapToGo = minMs => new Promise(res => {
  const t0 = Date.now(), n = $('#night');
  let done = false;
  const finish = () => { if (done) return; done = true; n.removeEventListener('pointerdown', h); res(); };
  const h = () => { if (Date.now() - t0 >= minMs) finish(); };
  n.addEventListener('pointerdown', h);
  setTimeout(finish, 4500);
});
async function flyHome() {
  const n = $('#night'), pc = $('#postcard'), slotI = S.healed;
  n.innerHTML = `<div class="moonbig"></div>${nightTrees()}<div class="flyer flying">${batSVG(S.cur.color, { happy: true, hat: S.cur.hat })}</div>`;
  n.classList.add('show');
  wrap.style.transition = 'opacity .4s'; wrap.style.opacity = '0';
  sfx.whoosh();
  await wait(3000);
  pc.innerHTML = postcardSVG(S.cur, S.cur.theme);
  pc.style.transition = ''; pc.style.transform = '';
  pc.classList.add('show'); sfx.yay();
  say('home');
  await wait(650);
  await tapToGo(600);
  n.classList.remove('show');
  const slot = $$('.slot')[slotI], pr = pc.getBoundingClientRect(), sr = slot.getBoundingClientRect();
  const a = center(pr), b = center(sr);
  pc.style.transition = 'transform .9s cubic-bezier(.5,-0.2,.5,1)';
  pc.style.transform = `translate(calc(-50% + ${(b.x - a.x).toFixed(0)}px), calc(-50% + ${(b.y - a.y).toFixed(0)}px)) scale(${(sr.width / pr.width).toFixed(3)}) rotate(0deg)`;
  sfx.whoosh();
  await wait(920);
  slot.classList.add('filled');
  slot.innerHTML = postcardSVG(S.cur, S.cur.theme) + `<span class="nm">${S.cur.name}</span>`;
  pc.classList.remove('show'); pc.style.transition = 'none'; pc.style.transform = ''; pc.innerHTML = '';
  sfx.pop();
}
async function flyToSlot(i) {
  const slot = $$('.slot')[i];
  const br = wrap.getBoundingClientRect(), sr = slot.getBoundingClientRect();
  const a = center(br), b = center(sr);
  wrap.classList.add('flying'); sfx.whoosh();
  wrap.style.transition = 'transform 1.1s cubic-bezier(.5,-0.25,.5,1), opacity .3s ease .85s';
  wrap.style.transform = `translate(${b.x - a.x}px,${b.y - a.y}px) scale(${sr.width / br.width})`;
  wrap.style.opacity = '0';
  await wait(1150);
  wrap.classList.remove('flying');
}

/* ================= flow ================= */
async function nextBat() {
  S.phase = 'entering'; S.wrong = 0; S.taps = 0; S.busy = false; S.step = null;
  S.cur = roster[S.healed];
  const p = S.cur.problem;
  renderMeter(); renderSteps(p); setStep(-1); tray.innerHTML = '';
  floatEl.innerHTML = batSVG(S.cur.color, { id: 'bat', hat: S.cur.hat });
  setHappy(.1);
  S.spot = rand(WING_SPOTS);
  if (p === 'scrape') { S.round = makeRound(S.healed); putScrape(); }
  else if (p === 'bump') putBump();
  else if (p === 'splinter') putSplinter();
  else setWeak(true);
  wrap.style.transition = 'none'; wrap.style.opacity = '1'; wrap.style.transform = 'translateX(110vw)';
  void wrap.getBoundingClientRect();
  wrap.classList.add('flying'); sfx.whoosh();
  wrap.style.transition = 'transform 1s cubic-bezier(.2,.9,.3,1.05)';
  wrap.style.transform = 'none';
  await wait(1000);
  wrap.classList.remove('flying');
  if (p === 'hungry') sfx.grumble(); else batAnim('sad');
  await say('n_' + S.cur.key);
  stepListen();
}
async function party() {
  S.phase = 'party';
  document.body.classList.add('party');
  $('#steps').innerHTML = '';
  confetti(55); sfx.yay();
  $$('.slot').forEach((s, i) => { s.style.animationDelay = (i * .12) + 's'; s.classList.add('dance'); });
  await say('party');
  await wait(900);
  $('#again').classList.add('show');
}
function startRound() { newRoster(); S.healed = 0; renderShelf(); nextBat(); }
function restart() {
  $('#again').classList.remove('show');
  document.body.classList.remove('party');
  startRound();
}
$('#again').addEventListener('click', () => { unlockAudio(); restart(); });

/* ================= effects ================= */
const FX_COLORS = ['#e0a930', '#f3e9d2', '#b5432f', '#5f9ea0'];
function sparkle(x, y, n = 8) {
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'spark';
    const ang = (i / n) * Math.PI * 2 + Math.random() * .5, dist = 50 + Math.random() * 60;
    el.style.setProperty('--x0', x + 'px'); el.style.setProperty('--y0', y + 'px');
    el.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
    el.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(0) + 'px');
    el.innerHTML = STAR_SMALL(rand(FX_COLORS.slice(0, 2)));
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }
}
function confetti(n) {
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'conf';
    const size = 20 + Math.random() * 24;
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.width = el.style.height = size + 'px';
    el.style.setProperty('--d', (2.4 + Math.random() * 2.2) + 's');
    el.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    el.style.animationDelay = (Math.random() * 1.6) + 's';
    el.innerHTML = STAR_SMALL(rand(FX_COLORS));
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 6500);
  }
}
const vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ================= grown-up panel (settings only; the voice ships with the app) ================= */
function renderPanel() {
  $('#optTts').checked = SET.tts; $('#optSfx').checked = SET.sfx;
  const hol = holidayFor(new Date());
  $('#optTheme').innerHTML = `<option value="auto">Automatic${hol ? ' (now: ' + THEME_NAMES[hol] + ')' : ' (holidays when close)'}</option>` +
    Object.keys(THEME_NAMES).map(k => `<option value="${k}">${THEME_NAMES[k]}</option>`).join('');
  $('#optTheme').value = SET.theme || 'auto';
}
function openPanel() {
  S.paused = true; stopVoice(); clearIdle();
  renderPanel(); $('#panel').classList.add('show');
}
function closePanel() {
  $('#panel').classList.remove('show');
  S.paused = false;
  if (S.phase === 'tool' || S.phase === 'healing') armIdle();
}
$('#closePanel').onclick = closePanel;
$('#optTts').onchange = e => { SET.tts = e.target.checked; saveSet(); };
$('#optSfx').onchange = e => { SET.sfx = e.target.checked; saveSet(); };
$('#optTheme').onchange = e => { SET.theme = e.target.value; saveSet(); };

// press-and-hold so little fingers don't open it by accident
(() => {
  const g = $('#gear'); let t = null;
  const cancel = () => { clearTimeout(t); g.classList.remove('holding'); };
  g.addEventListener('pointerdown', e => {
    e.preventDefault(); g.classList.add('holding');
    t = setTimeout(() => { cancel(); openPanel(); }, 1500);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => g.addEventListener(ev, cancel));
})();

/* ================= start ================= */
// a few twinkling stars in the night sky
(() => {
  const bg = $('#bg');
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('div'); s.className = 'twinkle';
    s.style.left = (8 + Math.random() * 84) + '%'; s.style.top = (18 + Math.random() * 45) + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    const z = 6 + Math.random() * 8; s.style.width = s.style.height = z + 'px';
    bg.appendChild(s);
  }
})();
$('#startBat').innerHTML = batSVG(BATS[0].color, { happy: true, hat: BATS[0].hat });
$('#play').addEventListener('click', async () => {
  unlockAudio();
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  $('#start').remove();
  say('welcome');               // started inside the tap so iOS allows speech
  await wait(2600);
  startRound();
});

// keep the page still on tablets
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) stopVoice(); });

// home-screen icon, drawn from the same bat
(() => {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#22364f"/><circle cx="200" cy="200" r="170" fill="#2f4a6d"/>` +
    batSVG(BATS[2].color, { happy: true, hat: BATS[2].hat }).replace('<svg ', '<svg x="0" y="60" width="400" height="300" ') + '</svg>';
  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 180;

    } catch (e) {}
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
})();

audio();
loadVoices();
})();
